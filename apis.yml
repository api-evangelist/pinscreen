aid: pinscreen
name: Pinscreen
description: >-
  Pinscreen is an American AI and VFX production company founded in 2015 by Hao Li
  (MIT TR35 winner and professor of computer vision at MBZUAI), headquartered in
  Los Angeles with a branch in Abu Dhabi (UAE). It builds advanced generative AI
  for film production and interactive experiences, including AI lip sync, face
  reenactment, face swaps, de-aging, voice cloning, and photoreal 3D avatar
  digitization, and is known for developing the world's first real-time deepfake
  technology. Its Avatar Neo product generates a photoreal, riggable 3D avatar
  from a single photo (exportable as GLB/FBX with animation rigs) and is offered
  to developers as the Avatar Neo SDK: Unreal and Unity engine plugins backed by
  an avatar-generation API that can be deployed anywhere. Customers include
  Netflix, Amazon Studios, Warner Bros, Miramax, Apple, Google, Adobe, and DARPA.
  Backed by Lux Capital and Middle East investors.
